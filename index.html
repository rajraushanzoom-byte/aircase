<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirCase: turn bad air into a complaint that gets read</title>
<style>
:root{--ink:#14232b;--sub:#46606c;--paper:#eef3f5;--card:#fff;--line:#b9c9d1;--tag:#f2b705;--teal:#0f4c5c;--bad:#a1260f}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:46rem;margin:0 auto;padding:1.5rem 1rem 4rem}
h1{font:700 2.4rem/1.1 Georgia,"Iowan Old Style",serif;margin:.5rem 0 .25rem}
h2{font:700 1.35rem/1.25 Georgia,serif;margin:0 0 .5rem}
h3{margin:1.25rem 0 .4rem}
.lede{color:var(--sub);margin:0 0 1.5rem;max-width:36rem}
section,form{background:var(--card);border:2px solid var(--ink);border-left:10px solid var(--tag);padding:1rem 1.1rem;margin:1rem 0}
input[type=text]{width:100%;font:inherit;padding:.65rem;border:2px solid var(--ink);background:#fff}
button,select{font:inherit;padding:.6rem 1rem;border:2px solid var(--ink);background:var(--teal);color:#fff;cursor:pointer;min-height:44px}
select{background:#fff;color:var(--ink)}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
form{display:grid;gap:.6rem}
label.sr{font-weight:600}
.big{font:700 1.6rem/1.2 Georgia,serif;margin:.2rem 0}
.advice{border-top:1px solid var(--line);padding-top:.5rem}
fieldset{border:0;padding:0;margin:.8rem 0}
legend{font-weight:700;margin-bottom:.3rem}
.opt{display:block;padding:.45rem .2rem;min-height:44px}
.opt input{width:1.2rem;height:1.2rem;margin-right:.4rem}
.row{display:grid;grid-template-columns:1fr 6rem 3rem;gap:.6rem;align-items:center;margin-top:.5rem}
.bar{display:block;height:.9rem;background:#dfe8ec;border:1px solid var(--ink)}
.bar span{display:block;height:100%;background:var(--teal)}
.pct{font-variant-numeric:tabular-nums;text-align:right}
.why,.note{font-size:.9rem;color:var(--sub);margin:.1rem 0 0}
.note{margin-top:.8rem;border-left:4px solid var(--tag);padding-left:.6rem}
textarea{width:100%;font:15px/1.5 ui-monospace,Consolas,monospace;padding:.7rem;border:2px solid var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.6rem}
#status{min-height:1.6rem;font-weight:600}
#status.err{color:var(--bad)}
@media (max-width:30rem){.row{grid-template-columns:1fr 3rem}.row .bar{grid-column:1/3;order:3}}
</style>
</head>
<body>
<main>
  <h1>AirCase</h1>
  <p class="lede">Bad air gets ignored when the complaint is vague. AirCase reads the pollutant fingerprint, asks what you can see and smell, and writes a complaint with evidence attached.</p>

  <form id="find">
    <label class="sr" for="place">Where is the air bad?</label>
    <input id="place" type="text" autocomplete="off" placeholder="Locality or city, e.g. Whitefield, Bengaluru" maxlength="80">
    <button type="submit">Check the air</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>

  <section id="readings" hidden></section>
  <section id="ask" aria-live="polite" hidden>
    <div id="questions"></div>
    <label for="notes" class="sr">Anything else you noticed (optional)</label>
    <input id="notes" type="text" maxlength="300" placeholder="e.g. started around 6 am, near the vacant plot on 5th Main">
    <p><button id="build" type="button" hidden>Build my case file</button></p>
  </section>
  <section id="case" hidden></section>
</main>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
